name: database-backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Check backup secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Create encrypted-transport logical backup
        run: node scripts/backup-supabase.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: artifacts/backups
          retention-days: 30
